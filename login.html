<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · NEXUS</title>
  <link rel="icon" href="nexus-favicon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="pantalla-acceso">

  <div class="acceso-escena" id="acceso-escena">

    <video id="video-fondo" class="acceso-video-fondo" autoplay muted loop playsinline aria-hidden="true"></video>
    <div class="acceso-video-capa" aria-hidden="true"></div>

    <!-- Marco del tamaño real del video (1280×720), reescalado por
         login.js para que calce exactamente con cómo el navegador
         recorta el video (mismo criterio que "object-fit: cover").
         Todo lo de aquí adentro usa % relativo a ESTE marco, así
         que queda pegado al video sin importar el tamaño de
         pantalla. -->
    <div class="acceso-marco-video" id="marco-video">

      <div class="campo-flotante campo-cedula">
        <label class="visualmente-oculto" for="correo">Cédula</label>
        <input class="acceso-entrada" type="text" id="correo" autocomplete="username" placeholder="Cédula" required>
      </div>

      <div class="campo-flotante campo-clave">
        <label class="visualmente-oculto" for="clave">Contraseña</label>
        <input class="acceso-entrada" type="password" id="clave" autocomplete="current-password" placeholder="Contraseña" required>
      </div>

      <div class="campo-flotante campo-boton">
        <button class="acceso-boton" id="btn-ingresar" type="button">Ingresar</button>
      </div>

      <p class="acceso-mensaje campo-flotante campo-mensaje" id="mensaje" role="alert" hidden></p>

    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
